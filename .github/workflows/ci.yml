name: Build and compatibility
on:
  push:
    branches: ['1.21.11']
  pull_request:
    branches: ['1.21.11']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run unit tests
        run: mvn -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slimefun-1.21.11
          path: |
            target/*.jar
            target/surefire-reports/*.xml
            target/runtime-smoke/**/console.log
            target/runtime-smoke/**/result.json
