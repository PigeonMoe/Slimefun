name: 问题反馈
description: 反馈 PigeonMoe 社区分支的问题或兼容性故障。
body:
  - type: markdown
    attributes:
      value: |
        这里是 PigeonMoe/Slimefun 社区 Fork 的反馈入口。请先搜索本仓库已有问题，并提供复现步骤及 `/sf versions` 的完整输出。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我使用的是 PigeonMoe/Slimefun 对应 Minecraft 分支的构建。
          required: true
        - label: 我已搜索本仓库的已有问题。
          required: true
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft 版本分支
      options:
        - '1.21.11'
        - '26.2'
        - 其他（请在版本输出中说明）
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: 完整版本信息
      description: 粘贴 /sf versions 输出，注明 Paper 构建、Java、Slimefun 提交或构建来源，以及附属插件版本。
      render: text
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述及预期行为
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 说明是否使用已有存档，能否在独立测试服复现，以及相关机器、物品或配方。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 提供相关错误、plugins/Slimefun/error-reports 中的报告或截图；请隐藏令牌和个人信息。
