[package]
name = "slimefun-horizon"
version = "0.1.0-dev.13"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata.horizon]
sdk = "5e18088ae4c8d3b765200cd15d56ebad1b2f09e3"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/crates/horizon-mod-api" }
serde_json = "1"
sha2 = "0.10"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }

[workspace]

[dev-dependencies]
horizon-mod-api = { path = ".horizon/sdk/crates/horizon-mod-api", features = ["testing"] }
